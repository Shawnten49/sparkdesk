<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f1ea" />
  <title>Sparkdesk · 灵感工作台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/tailwind-theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="mx-auto max-w-[1600px] px-4 pb-10 pt-5 sm:px-6 lg:px-8">
    <header class="mb-7 flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
      <div class="flex items-center gap-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-[1.15rem] bg-ink text-xl text-cream shadow-soft">
          <span aria-hidden="true">✦</span>
        </div>
        <div>
          <div class="flex items-center gap-3">
            <h1 class="text-[1.7rem] font-semibold tracking-[-0.04em]">Sparkdesk</h1>
            <span class="rounded-full border border-black/10 bg-white/50 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-stone-500">Local</span>
          </div>
          <p class="mt-0.5 text-sm text-stone-500">把零散念头，慢慢养成真正发生的事。</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <a href="/docs" target="_blank" rel="noopener noreferrer" class="rounded-xl border border-black/10 bg-white/45 px-4 py-2.5 text-sm font-medium text-stone-600 transition hover:bg-white/80 hover:text-ink">
          API 文档
        </a>
        <button id="newIdeaBtn" class="group flex items-center gap-2 rounded-xl bg-ink px-5 py-2.5 text-sm font-semibold text-white shadow-soft transition hover:-translate-y-0.5 hover:bg-black">
          <svg class="h-4 w-4 transition group-hover:rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          新建灵感
        </button>
      </div>
    </header>

    <section id="statsRow" class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-4" aria-label="灵感统计"></section>

    <main class="grid items-start gap-5 lg:grid-cols-[370px_minmax(0,1fr)] xl:grid-cols-[400px_minmax(0,1fr)]">
      <aside class="glass overflow-hidden rounded-[1.6rem] border border-white/70 shadow-soft lg:sticky lg:top-5">
        <div class="border-b border-black/[0.06] p-4 sm:p-5">
          <div class="relative">
            <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="searchInput" type="search" placeholder="搜索标题、简介或标签…" class="w-full rounded-xl border border-black/10 bg-white/60 py-2.5 pl-10 pr-4 text-sm outline-none transition placeholder:text-stone-400 focus:border-moss/40 focus:bg-white focus:ring-4 focus:ring-moss/5" />
          </div>
          <div id="statusFilters" class="mt-4 flex gap-1.5 overflow-x-auto pb-1 custom-scrollbar" aria-label="按状态筛选"></div>
          <div class="mt-3 flex items-center justify-between">
            <label class="flex cursor-pointer select-none items-center gap-2.5 text-xs font-medium text-stone-500">
              <span class="relative inline-flex h-5 w-9 items-center">
                <input id="showArchivedInput" type="checkbox" class="peer sr-only" />
                <span class="absolute inset-0 rounded-full bg-stone-300 transition peer-checked:bg-moss"></span>
                <span class="absolute left-0.5 h-4 w-4 rounded-full bg-white shadow-sm transition peer-checked:translate-x-4"></span>
              </span>
              显示归档
            </label>
            <span id="visibleCount" class="text-xs tabular-nums text-stone-400"></span>
          </div>
        </div>
        <div id="ideaList" class="custom-scrollbar max-h-[calc(100vh-330px)] min-h-[290px] space-y-2.5 overflow-y-auto p-3 sm:p-4"></div>
      </aside>

      <section id="detailPanel" class="min-w-0">
        <div id="emptyState" class="glass flex min-h-[640px] flex-col items-center justify-center rounded-[1.6rem] border border-white/70 p-8 text-center shadow-soft">
          <div class="relative mb-6 flex h-24 w-24 items-center justify-center rounded-[2rem] border border-white bg-white/70 text-4xl shadow-soft">
            ✦
            <span class="absolute -right-2 -top-2 h-5 w-5 rounded-full bg-coral/80"></span>
            <span class="absolute -bottom-1 -left-3 h-3 w-3 rounded-full bg-moss/70"></span>
          </div>
          <h2 class="text-xl font-semibold tracking-tight">让第一个念头落在这里</h2>
          <p class="mt-2 max-w-sm text-sm leading-6 text-stone-500">记录灵感、持续补充资料，再把模糊的期待拆成一个个能完成的小里程碑。</p>
          <button id="emptyCreateBtn" class="mt-6 rounded-xl border border-black/10 bg-white px-5 py-2.5 text-sm font-semibold text-ink shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">写下第一个灵感</button>
        </div>
        <div id="detailView" class="hidden space-y-4"></div>
      </section>
    </main>
  </div>

  <div id="toastContainer" class="pointer-events-none fixed bottom-5 right-5 z-[100] flex w-[min(360px,calc(100vw-2rem))] flex-col gap-2"></div>

  <div id="ideaModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-ink/35 backdrop-blur-sm" data-close-modal="ideaModal"></div>
    <div class="modal-in relative max-h-[92vh] w-full max-w-xl overflow-y-auto rounded-[1.5rem] border border-white bg-cream p-5 shadow-float sm:p-7 custom-scrollbar" role="dialog" aria-modal="true" aria-labelledby="ideaModalTitle">
      <div class="mb-6 flex items-start justify-between gap-4">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-coral">Idea canvas</p>
          <h2 id="ideaModalTitle" class="mt-1 text-2xl font-semibold tracking-tight">新建灵感</h2>
        </div>
        <button class="rounded-lg p-2 text-stone-400 transition hover:bg-black/5 hover:text-ink" data-close-modal="ideaModal" aria-label="关闭">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <form id="ideaForm" class="space-y-5">
        <input id="ideaIdInput" type="hidden" />
        <div>
          <label for="ideaTitleInput" class="mb-2 block text-xs font-semibold text-stone-600">标题 <span class="text-coral">*</span></label>
          <input id="ideaTitleInput" required maxlength="120" placeholder="例如：做一个小红书起号实验" class="w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-stone-300 focus:border-moss/50 focus:ring-4 focus:ring-moss/5" />
        </div>
        <div>
          <label for="ideaSummaryInput" class="mb-2 block text-xs font-semibold text-stone-600">一句话简介</label>
          <textarea id="ideaSummaryInput" maxlength="300" rows="3" placeholder="它是什么？为什么值得做？" class="w-full resize-none rounded-xl border border-black/10 bg-white px-4 py-3 text-sm leading-6 outline-none transition placeholder:text-stone-300 focus:border-moss/50 focus:ring-4 focus:ring-moss/5"></textarea>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="ideaStatusInput" class="mb-2 block text-xs font-semibold text-stone-600">当前状态</label>
            <select id="ideaStatusInput" class="w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:border-moss/50 focus:ring-4 focus:ring-moss/5"></select>
          </div>
          <div>
            <label for="ideaTagsInput" class="mb-2 block text-xs font-semibold text-stone-600">标签</label>
            <input id="ideaTagsInput" placeholder="内容, 副业, 实验" class="w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-stone-300 focus:border-moss/50 focus:ring-4 focus:ring-moss/5" />
          </div>
        </div>
        <p class="-mt-2 text-[11px] text-stone-400">多个标签请用逗号分隔，最多 12 个。</p>
        <div class="flex justify-end gap-2 border-t border-black/[0.06] pt-5">
          <button type="button" data-close-modal="ideaModal" class="rounded-xl px-5 py-2.5 text-sm font-medium text-stone-500 transition hover:bg-black/5">取消</button>
          <button type="submit" class="rounded-xl bg-ink px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-black">保存灵感</button>
        </div>
      </form>
    </div>
  </div>

  <div id="milestoneModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-ink/35 backdrop-blur-sm" data-close-modal="milestoneModal"></div>
    <div class="modal-in relative w-full max-w-md rounded-[1.5rem] border border-white bg-cream p-5 shadow-float sm:p-7" role="dialog" aria-modal="true" aria-labelledby="milestoneModalTitle">
      <div class="mb-6 flex items-start justify-between gap-4">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-moss">Milestone</p>
          <h2 id="milestoneModalTitle" class="mt-1 text-2xl font-semibold tracking-tight">添加里程碑</h2>
        </div>
        <button class="rounded-lg p-2 text-stone-400 transition hover:bg-black/5 hover:text-ink" data-close-modal="milestoneModal" aria-label="关闭">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <form id="milestoneForm" class="space-y-5">
        <input id="milestoneIdInput" type="hidden" />
        <div>
          <label for="milestoneNameInput" class="mb-2 block text-xs font-semibold text-stone-600">阶段目标 <span class="text-coral">*</span></label>
          <input id="milestoneNameInput" required maxlength="120" placeholder="例如：完成账号定位与选题库" class="w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-stone-300 focus:border-moss/50 focus:ring-4 focus:ring-moss/5" />
        </div>
        <div>
          <label for="milestoneDateInput" class="mb-2 block text-xs font-semibold text-stone-600">预计完成日期</label>
          <input id="milestoneDateInput" type="date" class="w-full rounded-xl border border-black/10 bg-white px-4 py-3 text-sm outline-none focus:border-moss/50 focus:ring-4 focus:ring-moss/5" />
        </div>
        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-black/[0.06] bg-white/60 px-4 py-3 text-sm text-stone-600">
          <input id="milestoneCompletedInput" type="checkbox" class="h-4 w-4 rounded" />
          这个里程碑已经完成
        </label>
        <div class="flex justify-end gap-2 border-t border-black/[0.06] pt-5">
          <button type="button" data-close-modal="milestoneModal" class="rounded-xl px-5 py-2.5 text-sm font-medium text-stone-500 transition hover:bg-black/5">取消</button>
          <button type="submit" class="rounded-xl bg-ink px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-black">保存里程碑</button>
        </div>
      </form>
    </div>
  </div>

  <div id="confirmModal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-ink/35 backdrop-blur-sm" data-confirm="cancel"></div>
    <div class="modal-in relative w-full max-w-sm rounded-[1.5rem] border border-white bg-cream p-6 shadow-float" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="mb-4 flex h-11 w-11 items-center justify-center rounded-xl bg-red-50 text-red-500">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4m0 4h.01"/><path d="M10.3 3.7 2.6 17.1A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.9L13.7 3.7a2 2 0 0 0-3.4 0Z"/></svg>
      </div>
      <h2 id="confirmTitle" class="text-lg font-semibold">确认删除？</h2>
      <p id="confirmMessage" class="mt-2 text-sm leading-6 text-stone-500">删除后无法恢复。</p>
      <div class="mt-6 flex justify-end gap-2">
        <button class="rounded-xl px-4 py-2.5 text-sm font-medium text-stone-500 transition hover:bg-black/5" data-confirm="cancel">取消</button>
        <button id="confirmOkBtn" class="rounded-xl bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700">确认删除</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
